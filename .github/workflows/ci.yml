name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dollarsafe
          POSTGRES_PASSWORD: dollarsafe
          POSTGRES_DB: dollarsafe
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dollarsafe" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://dollarsafe:dollarsafe@localhost:5432/dollarsafe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm test
      - run: npm run build
