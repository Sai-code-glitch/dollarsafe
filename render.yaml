# One-click deploy on Render: https://render.com/deploy?repo=https://github.com/Sai-code-glitch/dollarsafe
# Free plans: the web service sleeps after 15 minutes idle (first visit then takes ~1 minute),
# and Render's free Postgres expires after 30 days, so upgrade both before real customers rely on it.
services:
  - type: web
    name: dollarsafe
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    # Migrations run at start, where the private database network is always reachable.
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: dollarsafe-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      # Optional. Leave blank to launch in demo mode; add your key later under Environment.
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: dollarsafe-db
    plan: free
